name = "zhejiangfc-checkin"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# 定时任务配置 - 每天 UTC 0:00 执行（北京时间 8:00）
# 可以根据需要调整时间，格式：cron = "0 0 * * *" (分 时 日 月 星期)
# 注意：Cloudflare Workers 使用 UTC 时间
triggers = { cron = ["0 0 * * *"] }

# 环境变量配置
# 方式一（推荐）：自动登录 - 设置 USERNAME 和 PASSWORD
#   npx wrangler secret put USERNAME
#   npx wrangler secret put PASSWORD
# 方式二：手动设置 TOKEN
#   npx wrangler secret put TOKEN
# 如果同时设置了 TOKEN 和 USERNAME/PASSWORD，会优先使用 TOKEN
